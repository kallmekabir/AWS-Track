AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CareLine edge - private S3 (dashboard) fronted by CloudFront via Origin Access Control,
  SPA fallback 403/404 -> /index.html, and an /api/* behavior proxying to the EC2 core on
  HTTP:8000. A CloudFront Function strips the leading /api from the URI (the app has no
  /api prefix). No IAM roles created.

Parameters:
  WebBucketName:
    Type: String
  Ec2PublicDns:
    Type: String
    Description: Public DNS of the CareLine core EC2 instance
  AppPort:
    Type: Number
    Default: 8000
  AuthFunctionArn:
    Type: String
    Description: CloudFront Function ARN for basic auth (default behavior)
  AuthStripFunctionArn:
    Type: String
    Description: CloudFront Function ARN for basic auth + /api strip (api behavior)

Resources:
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref WebBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      Tags:
        - { Key: Project, Value: careline }
        - { Key: Owner, Value: infra }
        - { Key: Env, Value: hackathon }

  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${WebBucketName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: CareLine dashboard + API
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: s3-web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref Oac
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ec2-core
            DomainName: !Ref Ec2PublicDns
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: !Ref AppPort
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: s3-web
          ViewerProtocolPolicy: redirect-to-https
          # CachingOptimized managed policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !Ref AuthFunctionArn
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ec2-core
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            # CachingDisabled managed policy
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewerExceptHostHeader managed origin request policy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !Ref AuthStripFunctionArn
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
      Tags:
        - { Key: Project, Value: careline }
        - { Key: Owner, Value: infra }
        - { Key: Env, Value: hackathon }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  WebBucket:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
